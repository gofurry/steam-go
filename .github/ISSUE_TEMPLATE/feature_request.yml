name: Feature Request
description: Suggest an idea or improvement

body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature, improvement, or idea.
      placeholder: Share your idea...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: Optional. Tell us what problem this would solve or why it would be helpful.
    validations:
      required: false